spring.application.name=mcp-app
server.port=8081

#ollama config
spring.ai.ollama.base-url= http://localhost:11434
spring.ai.ollama.chat.options.model= llama3.1:latest
spring.ai.ollama.chat.options.temperature= 0.7

#logging config
#for web packages
logging.level.org.springframework.web=DEBUG
#for ai advisor package
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#mcp server configuration
#Tells the Spring AI MCP client to load the STDIO MCP server definitions from the servers.json file located in the application's classpath (typically src/main/resources).
spring.ai.mcp.client.stdio.servers-configuration=classpath:servers.json