version: '3.8'
services:
  ollama:
    image: ollama/ollama:0.3.12
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]   # Optional: for NVIDIA GPUs
    restart: unless-stopped

volumes:
  ollama_data: